<script>
// Player 3DVista simulado para probar el skin fuera de 3DVista
(function(){
  function Obj(p){ this.p=p; } Obj.prototype.get=function(k){return this.p[k];}; Obj.prototype.set=function(k,v){this.p[k]=v; if(k==='selectedIndex') document.title='Escena '+v;};
  Obj.prototype.trigger=function(){};
  var nombres=['Fachada','Sala principal','Cocina','Habitación 1','Habitación 2','Terraza','Piscina'];
  var items=nombres.map(function(n,i){return new Obj({media:new Obj({label:n,id:'panorama_'+i,'class':'Panorama'})});});
  var pl=new Obj({items:items,selectedIndex:0});
  var comps={};
  var player={mainPlayList:pl,getComponentByName:function(n){return comps[n]||(comps[n]=new Obj({visible:true}));}};
  window.TDV={PlayerAPI:{getCurrentPlayer:function(){return player;}}};
})();
</script></head><body>
<script src="export-demo/skin-3jc/tdv-helper.js"></script>
